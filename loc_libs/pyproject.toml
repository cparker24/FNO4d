[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "loc_libs"
version = "0.1.0"
description = "Local helper library for FNO4d — data I/O, visualisation, training utilities"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.25",
    "uproot",
    "awkward",
    "matplotlib",
    "h5py",
    "scikit-image",
    "psutil",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["loc_libs*"]
