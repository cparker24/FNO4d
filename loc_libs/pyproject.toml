[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "loc_libs"
version = "0.1.0"
description = "Local helper library for FNO4d — data I/O, visualisation, training utilities"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.25",
    "uproot",
    "awkward",
    "matplotlib",
    "h5py",
    "scikit-image",
    "psutil",
]

[project.optional-dependencies]
# GCS streaming (uproot reads gs:// URIs via fsspec) + download helper
#   pip install -e './loc_libs[gcs]'
#   or: pip install -r requirements-gcs.txt
gcs = [
    "gcsfs",
    "google-cloud-storage",
    "tqdm",
]
# AWS S3 streaming (uproot reads s3:// URIs via fsspec)
#   pip install -e './loc_libs[s3]'
#   or: pip install -r requirements-s3.txt
s3 = [
    "s3fs",
    "boto3",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["loc_libs*"]
