# ---------------------------------------------------------------------------
# FNO resume training config — pure PyTorch, HDF5 multi-file input
#
# Usage:
#   python resume_train_h5_torch.py [--config config_h5_resume.yaml]
#
# This file extends config_h5.yaml with resume-specific keys.
# All keys from config_h5.yaml are still valid here.
#
# Resume scenario quick-reference
# --------------------------------
# 1. Same machine, resume from last checkpoint (most common):
#      resume_model_source: local
#      resume_model_dir:    ./checkpoints   # points at the original model_dir
#      checkpoint_type:     last
#      total_epochs:        200             # must exceed last saved epoch
#
# 2. Resume from a periodic checkpoint (epoch 50):
#      resume_model_source: local
#      resume_model_dir:    ./checkpoints
#      checkpoint_type:     periodic
#      checkpoint_epoch:    50
#      total_epochs:        200
#
# 3. Resume from GCS (download checkpoint, train locally):
#      resume_model_source: gcs_download
#      resume_model_dir:    gs://my-bucket/runs/run01/checkpoints
#      local_model_cache:   ./cache/checkpoints
#      gcs_key_file:        ./my-service-account.json
#      checkpoint_type:     last
#      total_epochs:        200
# ---------------------------------------------------------------------------

# --- mode selection --------------------------------------------------------
data_source: local         # local | gcs_download

# --- resume configuration --------------------------------------------------

# Total epoch target.  remaining = total_epochs − (last saved epoch).
# Must be greater than the epoch saved in the checkpoint.
total_epochs: 200

# Where the saved checkpoint lives.
#   local        — checkpoint is on the local filesystem.
#   gcs_download — download from GCS into local_model_cache first.
resume_model_source: local

# Path to the checkpoint directory.  For 'last' checkpoint_type this is the
# directory that contains last_model.pt.
# Defaults to model_dir when omitted.
# For gcs_download use a gs:// URI, e.g. gs://my-bucket/runs/run01/checkpoints
resume_model_dir: ./checkpoints

# [gcs_download only] Local directory where the checkpoint is cached.
local_model_cache: ./cache/checkpoints

# Which checkpoint to load.
#   last     — loads last_model.pt written by save_last: true.
#   periodic — loads from checkpoint_N/ sub-directory (set checkpoint_epoch).
#              Requires checkpoint_freq to have been set in the original run.
checkpoint_type: last

# [periodic only] Epoch number N of the checkpoint_N/ sub-directory to load.
# checkpoint_epoch: 50

# --- output ----------------------------------------------------------------
odir:      ./out           # logs, metrics, training curves
model_dir: ./checkpoints   # best_model.* and periodic checkpoints are written here

# --- input data (HDF5) -----------------------------------------------------
# [local]    bare filenames resolved relative to hdf5_dir.
# [download] full gs:// URIs downloaded to local_data_dir first.
hdf5_dir: ../data

hdf5_files:
  - dAu_25ev_mb.h5
  # - dAu_25ev_mb_2.h5

nevents_in:  10    # events to load (-1 = all)
start_event:  0    # first global event index

# --- GCS authentication (required for gcs_download) -----------------------
gcs_key_file: ./fnotest-wayne-gcs.json

# --- GCS data download cache [gcs_download data] --------------------------
local_data_dir:    ../data
overwrite_cache:   false
gcs_show_progress: false    # null=auto  true=always  false=never

# --- GCS output upload (optional) -----------------------------------------
# Upload odir + model_dir to GCS after training completes.
# Remove or set to null to skip.
# gcs_output_prefix: gs://my-bucket/runs/run01_resume

# --- loading strategy ------------------------------------------------------
lazy: true

# --- normalisation ---------------------------------------------------------
# This should match the normalization block used in the original training run.
# The normalizer is preferably loaded from the checkpoint (normalizer.npz);
# this block is only used as a fallback if normalizer.npz is not found.
# Data-driven normalizers stream the training split in chunks to compute their
# reference — norm_chunk_size controls peak RAM during that step.
normalization:
  name: none              # none | etau75_3d | etau75_eta_3d |
                          # etau75_eta_shape_3d | cosh_etau75_3d
  # alpha: 1.0            # only used by cosh_etau75_3d
norm_chunk_size: 64       # [lazy, data-driven] events per chunk when computing ref

# --- data preparation ------------------------------------------------------
train_ratio: 0.8
xyslice:  [null, -1]      # must match the original training run
etaslice: [null, -1]      # must match the original training run
tauslice: [null, null]    # must match the original training run

# --- model architecture (must match the checkpoint exactly) ---------------
hidden_channels: 16
n_modes: [32, 32, 16, 16]

# --- training (for the resumed portion only) -------------------------------
batch_size: 1
checkpoint_freq: null      # save checkpoint every N epochs; null = disabled
min_save_epoch:  null      # skip saves before this epoch; null = from epoch 0
save_last: true            # write last_model.* after the final epoch
eval_interval: 2
test_batch_sizes: [2]
num_workers: 4             # DataLoader workers; 0 = synchronous

# --- optimizer (used for the resumed portion; loaded from checkpoint if available) ---
lr: 8.0e-3
weight_decay: 1.0e-4

# --- logging ---------------------------------------------------------------
log_directly: true         # append-mode: resumes appending to training.log
