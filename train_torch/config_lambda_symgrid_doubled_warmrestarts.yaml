# ---------------------------------------------------------------------------
# FNO training config — pure PyTorch — Lambda Cloud (1x A100/H100 80GB)
#
# Warm-restart ablation on the CURRENT production checkpoint's exact data
# and recipe (config_lambda_symgrid_eta4_n65_notemp_extended_90split_
# etamodes32.yaml with the doubled/v2 input batch -- see that file's own
# header for the symmetric-grid/data-doubling rationale, unchanged here).
# Every setting below is identical to that config EXCEPT the LR scheduler
# (see "scheduler" under --- training ---) -- this is a controlled,
# single-variable test of whether periodic LR resets help on this lineage.
#
# Why this is worth re-testing despite a prior negative result: an earlier,
# smaller lineage (eta2, 16 eta Fourier modes, 199-event dataset --
# config_widened_eta_16step_warmrestarts.yaml, see PARTICLIZATION_
# INVESTIGATION.md's "Three training runs, same data, different LR
# schedules") found CosineAnnealingWarmRestarts(T_0=25, T_mult=1) strictly
# WORSE each cycle (best eval L2: 1.061 -> 1.07 -> 1.12 -> 1.13 across 4
# cycles in 100 epochs) -- the signature of deepening overfitting, not
# escaping a plateau, confirmed by an isolated 25-epoch single-decay
# control landing at 1.089 (statistically the same as cycle 1). That test
# predates the symmetric-grid fix, the doubled eta-Fourier-mode count, and
# the doubled (100 ev/centrality) dataset used here, so it is not certain
# to repeat on this lineage -- this run gets a clean data point rather than
# assuming the old result transfers.
#
# Budget (updated): the first attempt at T_0=25/n_epochs=50 (2 short
# cycles) gave no improvement over the single-cosine production
# checkpoint (matched-IC dN/dy ratio 1.0307 vs. 1.0149, plus a new
# forward-rapidity asymmetry -- see CURRENT_MODEL_STATUS.md section 5)
# and never reached a comfortable plateau: eval 64_l2 only barely beat
# its own pre-restart best right at the final epoch (see
# checkpoints_lambda_symgrid_doubled_warmrestarts/training_progress.png).
# This run gives each cycle the FULL production epoch budget instead of
# half of it -- T_0=50, T_mult=1, n_epochs=150 -- so each of the 3 cycles
# gets as long to anneal as the production recipe's single decay did,
# rather than cutting every cycle short. Output paths below were renamed
# (_3x50 suffix) specifically so this doesn't overwrite the already-
# analyzed 2x25 run's checkpoint/GCS output.
#
# Usage:
#   python train_torch.py --config config_lambda_symgrid_doubled_warmrestarts.yaml
#
# Run via setup_and_train_lambda.sh (same script, no changes needed --
# TRAIN_CONFIG is already parameterized):
#   TRAIN_CONFIG=config_lambda_symgrid_doubled_warmrestarts.yaml bash setup_and_train_lambda.sh
# ---------------------------------------------------------------------------

# --- mode selection ---
data_source: gcs_download   # downloads input_files to local_data_dir, then trains locally

# --- output ---
odir:      ./out_lambda_symgrid_doubled_warmrestarts_3x50
model_dir: ./checkpoints_lambda_symgrid_doubled_warmrestarts_3x50

# --- input data ---
# IDENTICAL to config_lambda_symgrid_eta4_n65_notemp_extended_90split_
# etamodes32.yaml's doubled (100 ev/centrality, v2 batch included) input
# set -- see that file's header for the full provenance/rationale.
input_files:
  - gs://test_fno/training_data/eta4_n65_symgrid/AuAu_50ev_0_10_eta4_n65_symgrid.root
  - gs://test_fno/training_data/eta4_n65_symgrid/AuAu_50ev_10_20_eta4_n65_symgrid.root
  - gs://test_fno/training_data/eta4_n65_symgrid/AuAu_50ev_20_30_eta4_n65_symgrid.root
  - gs://test_fno/training_data/eta4_n65_symgrid/AuAu_50ev_30_40_eta4_n65_symgrid.root
  - gs://test_fno/training_data/eta4_n65_symgrid/AuAu_50ev_v2_0_10_eta4_n65_symgrid.root
  - gs://test_fno/training_data/eta4_n65_symgrid/AuAu_50ev_v2_10_20_eta4_n65_symgrid.root
  - gs://test_fno/training_data/eta4_n65_symgrid/AuAu_50ev_v2_20_30_eta4_n65_symgrid.root
  - gs://test_fno/training_data/eta4_n65_symgrid/AuAu_50ev_v2_30_40_eta4_n65_symgrid.root

# Dedicated validation set (20 events/centrality, seed 802701) -- identical
# to the production config. train_ratio below is ignored while this is
# set; ALL of input_files trains.
validation_files:
  - gs://test_fno/validation_data/eta4_n65_symgrid/AuAu_valid20ev_0_10_eta4_n65_symgrid.root
  - gs://test_fno/validation_data/eta4_n65_symgrid/AuAu_valid20ev_10_20_eta4_n65_symgrid.root
  - gs://test_fno/validation_data/eta4_n65_symgrid/AuAu_valid20ev_20_30_eta4_n65_symgrid.root
  - gs://test_fno/validation_data/eta4_n65_symgrid/AuAu_valid20ev_30_40_eta4_n65_symgrid.root

nevents_in: -1            # events to load (-1 = all), applies to both input_files and validation_files

# --- GCS authentication [gcs] ---
gcs_key_file: ./fnotest-wayne-gcs.json

# --- GCS download cache [download] ---
local_data_dir:    ../data  # downloaded ROOT files are cached here
overwrite_cache:   false    # true = re-download even if size matches
gcs_show_progress: null     # null=auto  true=always  false=never

# --- post-training GCS upload [gcs] ---
# Distinct run name -- this ablation must never overwrite the production
# checkpoint's own GCS run output, nor the already-analyzed 2x25-cycle
# warm-restart run's output (gs://test_fno/runs/symgrid_doubled_warmrestarts).
gcs_output_prefix: gs://test_fno/runs/symgrid_doubled_warmrestarts_3x50

# --- normalisation ---
normalization:
  name: etau75_3d              # tau-only scaling of channel 0; unaffected by drop_channels below
  alpha: 1.0

# IDENTICAL rationale to the production config -- see its header.
storage_dtype: float16

# --- data preparation --- (all identical to the production config)
train_ratio: 0.9           # ignored -- validation_files is set above, so ALL of input_files trains
drop_channels: [1]         # drop temperature (index 1 of [rho, T, vx, vy, vz])
xyslice:  null
etaslice: null
tauslice: [null, 120]
min_ntau_freezeout: 10

# --- model --- (identical architecture to the production config)
hidden_channels: 16
n_modes: [32, 32, 32, 16] # Fourier modes [x, y, eta, tau]

# --- training ---
n_epochs: 200               # 4 full cycles of 50 epochs each -- see header for why
batch_size: 1
checkpoint_freq: null     # save checkpoint every N epochs; null = disabled
min_save_epoch:  null     # skip best/checkpoint saves before this epoch; null = save from epoch 0
save_last: true           # save final epoch state to model_dir/last_model.*
eval_interval: 2          # run evaluation every N epochs
test_batch_sizes: [2]     # eval batch size per test resolution

# --- optimizer ---
lr: 8.0e-3
weight_decay: 1.0e-4

# THE ONE CHANGE vs. the production config: periodic LR resets instead of
# a single smooth decay. T_0=50/T_mult=1 over n_epochs=150 gives exactly 3
# complete cycles, each as long as the production recipe's single decay --
# see header for why this is a bigger budget than the first 2x25 attempt.
# "best" checkpoint logic (train_torch.py) saves on eval score regardless
# of cycle position, so a mid-cycle disruption won't overwrite a better
# pre-restart checkpoint.
scheduler:
  name: cosine_warm_restarts
  T_0: 50       # epochs in the first cycle
  T_mult: 1     # every cycle is the same length (3 cycles in 150 epochs)

# --- logging ---
log_directly: true        # mirror output to training.log
