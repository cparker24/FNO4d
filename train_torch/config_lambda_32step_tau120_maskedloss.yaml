# ---------------------------------------------------------------------------
# FNO training config — pure PyTorch — Lambda Cloud (1x A100 40GB)
#
# Retrain of config_lambda_32step_tau120.yaml with the ONLY change being
# code, not config: train_torch.py now wraps its loss in TailMaskedLoss
# (loc_libs/masked_loss.py, commit dff91ba) so the zero-padded tail past
# each event's own ntau_freezeout no longer contributes to the loss. The
# first run of this config (before the fix) was found, via a direct
# model-vs-ground-truth comparison, to have learned a single dataset-average
# "shutoff tau" instead of each event's own freeze-out time -- its predicted
# energy density collapsed to near-zero around tau~9.5-10.5 fm regardless of
# an event's true (sometimes later) freeze-out time, which was the dominant
# driver of the severe, centrality-dependent yield deficits documented in
# "Root cause of the yield deficit" in
# js-contrib contribs/FnoHydro/PARTICLIZATION_INVESTIGATION.md. Everything
# else here (grid, tauslice, epochs, optimizer) is identical to that first
# run on purpose, so this is a controlled test of the loss-masking fix alone.
#
# Usage:
#   python train_torch.py --config config_lambda_32step_tau120_maskedloss.yaml
#
# Run via setup_and_train_lambda.sh:
#   TRAIN_CONFIG=config_lambda_32step_tau120_maskedloss.yaml bash setup_and_train_lambda.sh
# ---------------------------------------------------------------------------

# --- mode selection ---
data_source: gcs_download   # downloads input_files to local_data_dir, then trains locally

# --- output ---
# Same memory profile as the first tauslice=120 run (~34.1GB estimated,
# 34.26GB actual) since the grid/tauslice/model are unchanged -- only the
# loss masking differs. See config_lambda_32step_tau120.yaml's header for
# the full memory-budget derivation.
odir:      ./out_lambda_32step_tau120_maskedloss
model_dir: ./checkpoints_lambda_32step_tau120_maskedloss

# --- input data ---
# [gcs_download] full gs:// URIs; downloaded to local_data_dir before training.
# Uploaded via remote_transfer/js_gcs.py -- see PARTICLIZATION_INVESTIGATION.md
# or the session that generated these files for how to regenerate/re-upload.
input_files:
  - gs://test_fno/training_data/widened_eta_n33/AuAu_50ev_0_10_eta2_n33.root
  - gs://test_fno/training_data/widened_eta_n33/AuAu_50ev_10_20_eta2_n33.root
  - gs://test_fno/training_data/widened_eta_n33/AuAu_50ev_20_30_eta2_n33.root
  - gs://test_fno/training_data/widened_eta_n33/AuAu_50ev_30_40_eta2_n33.root

nevents_in: -1            # events to load (-1 = all)

# --- GCS authentication [gcs] ---
# setup_and_train_lambda.sh copies this in from wherever you staged it on the
# instance (see that script's header) -- it is NOT committed to git.
gcs_key_file: ./fnotest-wayne-gcs.json

# --- GCS download cache [download] ---
local_data_dir:    ../data  # downloaded ROOT files are cached here
overwrite_cache:   false    # true = re-download even if size matches
gcs_show_progress: null     # null=auto  true=always  false=never

# --- post-training GCS upload [gcs] ---
# Uploads model_dir -> {this}/checkpoints and odir -> {this}/logs once
# training finishes. Separate run name (not the original
# widened_eta_32step_tau120_lambda) so the first run's checkpoint/logs,
# already analyzed in PARTICLIZATION_INVESTIGATION.md, aren't overwritten.
gcs_output_prefix: gs://test_fno/runs/widened_eta_32step_tau120_lambda_maskedloss

# --- normalisation ---
normalization:
  name: etau75_3d              # tau-only scaling; unaffected by the eta slice below
  alpha: 1.0

# --- data preparation ---
train_ratio: 0.8
xyslice:  [null, -1]       # slice(None, -1) — drop last spatial bin (65 -> 64)
# Raw neta=33 (power-of-2+1). Drop ONLY the last bin (same off-by-one
# correction as x/y, 33 -> 32) -- no stride, so all 32 remaining bins are
# kept at the raw 0.125 spacing. Same choice as config_widened_eta_32step_25ep.yaml.
etaslice: [null, -1]
# Unchanged from the first tauslice=120 run -- still long enough to reach
# genuine freeze-out for every centrality at the original Tfo.
tauslice: [null, 120]
min_ntau_freezeout: 10     # drops the one bad 0-10% event (ntau_freezeout=2)

# --- model ---
hidden_channels: 16
# eta Fourier modes kept at 16 (not doubled to match neta=32) -- matches
# config_widened_eta_32step_25ep.yaml's choice (doubling modes roughly
# doubles params/memory; 16 modes on a 32-point axis also matches the
# modes=axis/2 convention already used for x/y).
n_modes: [32, 32, 16, 16] # Fourier modes [x, y, eta, tau]

# --- training ---
n_epochs: 25               # same schedule as every other widened-eta model in this investigation
batch_size: 1
checkpoint_freq: null     # save checkpoint every N epochs; null = disabled
min_save_epoch:  null     # skip best/checkpoint saves before this epoch; null = save from epoch 0
save_last: true           # save final epoch state to model_dir/last_model.*
eval_interval: 2          # run evaluation every N epochs
test_batch_sizes: [2]     # eval batch size per test resolution

# --- optimizer ---
# CosineAnnealingLR's T_max tracks n_epochs (=25), a single full decay from
# 8e-3 to ~0 -- same schedule as every other widened-eta model.
lr: 8.0e-3
weight_decay: 1.0e-4

# --- logging ---
log_directly: true        # mirror output to training.log
