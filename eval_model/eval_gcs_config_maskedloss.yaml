# ---------------------------------------------------------------------------
# FNO eval-GCS configuration — masked-loss tau120 32-step 3D+1 model
#
# Points eval_gcs_setup.run_all() at the TailMaskedLoss retrain
# (FNO4d commit dff91ba) used throughout the particlization investigation
# (see X-SCAPE/external_packages/js-contrib/contribs/FnoHydro/PARTICLIZATION_INVESTIGATION.md).
# Everything is local -- no GCS needed: the checkpoint was already pulled
# down for TorchScript export, and the exact widened-eta n33 training ROOT
# files it was trained on are already cached at /home/cparker/jetscape-docker/rootfiles/.
#
# "Truth" (y_true_phys) in this framework IS real MUSIC+iSS output -- these
# ROOT files are generated by the actual X-SCAPE/MUSIC pipeline, not a
# synthetic target -- so eval_mode: cont directly gives FNO-vs-MUSIC
# eta-sliced energy-density contour comparisons on held-out events, without
# needing to rerun the live JetScape pipeline at all.
#
# Usage:
#   EVAL_GCS_CONFIG=eval_gcs_config_maskedloss.yaml marimo run eval_gcs_clean.py
# or from a notebook:
#   eval_gcs_setup.run_all(cfg_path='eval_gcs_config_maskedloss.yaml')
# ---------------------------------------------------------------------------

# --- GCS authentication ---
# Not needed: model and data are both local.
gcs_key_file: null

# ---------------------------------------------------------------------------
# Model source
# ---------------------------------------------------------------------------
model_access: local
model_dir: ../train_torch/checkpoints_lambda_32step_tau120_maskedloss

model_local_cache: ./cache/models/

# --- Training config ---
train_config: ../train_torch/checkpoints_lambda_32step_tau120_maskedloss/config.yaml

# ---------------------------------------------------------------------------
# Data source
# ---------------------------------------------------------------------------
data_access: local

# ONE file only, by design -- see the memory note below.
#
# This is also not an arbitrary choice: train_torch.py's train/verify split
# is a simple positional cut on the 4 files concatenated in THIS order
# (0-10, 10-20, 20-30, 30-40, ~50 events each, train_ratio=0.8), so for the
# full 200-event dataset the held-out ~20% (indices 160-199) falls ENTIRELY
# inside 30-40%'s own 50-event block (see "Root cause found..." in
# PARTICLIZATION_INVESTIGATION.md) -- 0-10/10-20/20-30 events were ALL
# literally in the training set. 30-40% is the only file with genuinely
# held-out events, so it's the default here (use_train_split: true below
# reproduces the correct last-20%-of-this-file boundary). To look at the
# other centralities instead, point data_files at that file and switch
# use_train_split to false (those events are real MUSIC output either way --
# just not held-out, so treat generalization claims from them accordingly).
data_files:
  - ../../rootfiles/AuAu_50ev_30_40_eta2_n33.root

data_format: auto

# true → the same held-out-from-training split boundary train_torch.py used
# (same train_ratio, same event order within this file) -- genuine
# never-trained-on comparison events for 30-40%, not just any events.
use_train_split: true

# IMPORTANT -- memory, not just speed: eval_gcs_setup.load_data() reads
# every requested event's RAW (pre-xyslice/etaslice/tauslice) grid into one
# array before any slicing. For this 3D+1 widened-eta model that's ~335 MB/
# event (65*65*33*120*5 floats) -- all 4 files (200 events) peaks north of
# 110 GB just loading, before model_out_phys/y_true_phys are even
# allocated, and OOM-killed (exit 137) on a 125 GB host even after fixing
# load_data()'s data_test view-vs-copy leak (see that function's comment).
# One ~50-event file keeps the whole pipeline comfortably under ~20 GB.
nevents: -1

data_local_cache: ./cache/data
gcs_overwrite_cache: false
gcs_show_progress: null

# ---------------------------------------------------------------------------
# Eval options
# ---------------------------------------------------------------------------
backend: torch
checkpoint_type: best
checkpoint_epoch: 10

# 3D+1 FNO forward pass (5 channels, neta=32, ntau=119) is heavier per-event
# than the 2D+1 models this tooling was first built for; keep at 1 unless
# you have GPU headroom to spare.
eval_batch_size: 1

# cont = CDF-based eta-sliced energy-density contour overlays (what this
# config exists for); see eval_contours_music.ipynb.
eval_mode: cont

active_threshold: 0.3
metric_backend: torch

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
odir: ./out_maskedloss
