# ---------------------------------------------------------------------------
# Config for mem_test_load_h5.py — HDF5 multi-file memory test
#
# Usage:
#   python mem_test_load_h5.py [--config config_h5.yaml]
# ---------------------------------------------------------------------------

# --- input data ------------------------------------------------------------
# Directory prepended to each entry in hdf5_files.
hdf5_dir: ../data

# Pre-converted .h5 files produced by convert_root_to_hdf5().
# All files must have identical grid dimensions (nFeatures, nx, ny, neta, ntau).
hdf5_files:
  - dAu_25ev_mb.h5
  - dAu_25ev_mb_2.h5   # add more files here

# --- loading strategy ------------------------------------------------------
# true  → dat['arr'] is a MultiH5Array; reads from disk only when sliced.
#          Peak RAM ≈ one batch.  Best for large datasets.
# false → dat['arr'] is a contiguous ndarray loaded immediately.
#          Faster iteration after the initial load.
lazy: true

nevents_in:  -1    # events to load (-1 = all across all files)
start_event:  0    # first global event index

# --- data preparation ------------------------------------------------------
train_ratio: 0.8
xyslice:  [null, -1]   # slice(None, -1) — drop last spatial bin
tauslice: [null, -1]   # slice(None, -1) — drop last tau bin

# --- data loaders ----------------------------------------------------------
batch_size:      4
test_batch_size: 4

# --- logging ---------------------------------------------------------------
log_directly: true
log_path: ./mem_test_load_h5.log
