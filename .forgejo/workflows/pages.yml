name: Deploy to Codeberg Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: |
          pip install \
            mkdocs-material \
            mkdocstrings[python] \
            mkdocs-redirects \
            pymdown-extensions

      - name: Build site
        run: mkdocs build --site-dir site --strict

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: "https://jhputschke.codeberg.page/FNO4d/"
          token: ${{ forge.token }}
          source: site/
